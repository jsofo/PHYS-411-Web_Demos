:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: 5px;

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {

}

.btn-primary {

  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;

.form-label {

  padding: 8px 10px;

}

.form-control:focus-visible {
  border-color: var(--ring);

.form-control:disabled,
.form-select:disabled {

  opacity: 0.4;

  min-height: 28px;

  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);

  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-check-input {

    border-color 150ms,

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;perturbation-square-root-viz&quot;&gt;
  &lt;h2&gt;Exact ± branches and perturbation truncations, 0 &amp;lt; x &amp;lt; 1&lt;/h2&gt;
  &lt;section class=&quot;psr-formulas&quot; aria-label=&quot;Mathematical formulas used in the plot&quot;&gt;
    &lt;div class=&quot;psr-formula-wide&quot;&gt;
      &lt;span class=&quot;psr-formula-label&quot;&gt;Exact branches&lt;/span&gt;
      &lt;math display=&quot;block&quot; aria-label=&quot;f plus or minus of x equals plus or minus the square root of one plus four x squared, for zero less than x less than one&quot;&gt;
        &lt;mrow&gt;
          &lt;msub&gt;&lt;mi&gt;f&lt;/mi&gt;&lt;mo&gt;±&lt;/mo&gt;&lt;/msub&gt;
          &lt;mo&gt;(&lt;/mo&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mo&gt;)&lt;/mo&gt;
          &lt;mo&gt;=&lt;/mo&gt;&lt;mo&gt;±&lt;/mo&gt;
          &lt;msqrt&gt;&lt;mrow&gt;&lt;mn&gt;1&lt;/mn&gt;&lt;mo&gt;+&lt;/mo&gt;&lt;mn&gt;4&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;/msup&gt;&lt;/mrow&gt;&lt;/msqrt&gt;
          &lt;mo&gt;,&lt;/mo&gt;&lt;mspace width=&quot;0.5em&quot;&gt;&lt;/mspace&gt;
          &lt;mn&gt;0&lt;/mn&gt;&lt;mo&gt;&amp;lt;&lt;/mo&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mo&gt;&amp;lt;&lt;/mo&gt;&lt;mn&gt;1&lt;/mn&gt;
        &lt;/mrow&gt;
      &lt;/math&gt;
    &lt;/div&gt;
    &lt;div class=&quot;psr-formula-wide&quot;&gt;
      &lt;span class=&quot;psr-formula-label&quot;&gt;Order-&lt;i&gt;n&lt;/i&gt; branches&lt;/span&gt;
      &lt;math display=&quot;block&quot; aria-label=&quot;f plus or minus order n of x equals plus or minus P sub n of x, for n equal to 2, 4, 6, or 8&quot;&gt;
        &lt;mrow&gt;
          &lt;msubsup&gt;&lt;mi&gt;f&lt;/mi&gt;&lt;mo&gt;±&lt;/mo&gt;&lt;mrow&gt;&lt;mo&gt;[&lt;/mo&gt;&lt;mi&gt;n&lt;/mi&gt;&lt;mo&gt;]&lt;/mo&gt;&lt;/mrow&gt;&lt;/msubsup&gt;
          &lt;mo&gt;(&lt;/mo&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mo&gt;)&lt;/mo&gt;
          &lt;mo&gt;=&lt;/mo&gt;&lt;mo&gt;±&lt;/mo&gt;
          &lt;msub&gt;&lt;mi&gt;P&lt;/mi&gt;&lt;mi&gt;n&lt;/mi&gt;&lt;/msub&gt;
          &lt;mo&gt;(&lt;/mo&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mo&gt;)&lt;/mo&gt;
          &lt;mo&gt;,&lt;/mo&gt;&lt;mspace width=&quot;0.5em&quot;&gt;&lt;/mspace&gt;
          &lt;mi&gt;n&lt;/mi&gt;&lt;mo&gt;∈&lt;/mo&gt;&lt;mo&gt;{&lt;/mo&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;mo&gt;,&lt;/mo&gt;&lt;mn&gt;4&lt;/mn&gt;&lt;mo&gt;,&lt;/mo&gt;&lt;mn&gt;6&lt;/mn&gt;&lt;mo&gt;,&lt;/mo&gt;&lt;mn&gt;8&lt;/mn&gt;&lt;mo&gt;}&lt;/mo&gt;
        &lt;/mrow&gt;
      &lt;/math&gt;
    &lt;/div&gt;
    &lt;div class=&quot;psr-truncations&quot; aria-label=&quot;Perturbation polynomials about x equals zero&quot;&gt;
      &lt;div class=&quot;psr-formula-item&quot;&gt;
        &lt;span class=&quot;psr-formula-swatch psr-o2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
        &lt;math display=&quot;block&quot; aria-label=&quot;P sub 2 of x equals one plus two x squared&quot;&gt;
          &lt;mrow&gt;
            &lt;msub&gt;&lt;mi&gt;P&lt;/mi&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;/msub&gt;&lt;mo&gt;(&lt;/mo&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mo&gt;)&lt;/mo&gt;&lt;mo&gt;=&lt;/mo&gt;
            &lt;mn&gt;1&lt;/mn&gt;&lt;mo&gt;+&lt;/mo&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;/msup&gt;
          &lt;/mrow&gt;
        &lt;/math&gt;
      &lt;/div&gt;
      &lt;div class=&quot;psr-formula-item&quot;&gt;
        &lt;span class=&quot;psr-formula-swatch psr-o4&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
        &lt;math display=&quot;block&quot; aria-label=&quot;P sub 4 of x equals one plus two x squared minus two x to the fourth&quot;&gt;
          &lt;mrow&gt;
            &lt;msub&gt;&lt;mi&gt;P&lt;/mi&gt;&lt;mn&gt;4&lt;/mn&gt;&lt;/msub&gt;&lt;mo&gt;(&lt;/mo&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mo&gt;)&lt;/mo&gt;&lt;mo&gt;=&lt;/mo&gt;
            &lt;mn&gt;1&lt;/mn&gt;&lt;mo&gt;+&lt;/mo&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;/msup&gt;
            &lt;mo&gt;−&lt;/mo&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;4&lt;/mn&gt;&lt;/msup&gt;
          &lt;/mrow&gt;
        &lt;/math&gt;
      &lt;/div&gt;
      &lt;div class=&quot;psr-formula-item&quot;&gt;
        &lt;span class=&quot;psr-formula-swatch psr-o6&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
        &lt;math display=&quot;block&quot; aria-label=&quot;P sub 6 of x equals one plus two x squared minus two x to the fourth plus four x to the sixth&quot;&gt;
          &lt;mrow&gt;
            &lt;msub&gt;&lt;mi&gt;P&lt;/mi&gt;&lt;mn&gt;6&lt;/mn&gt;&lt;/msub&gt;&lt;mo&gt;(&lt;/mo&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mo&gt;)&lt;/mo&gt;&lt;mo&gt;=&lt;/mo&gt;
            &lt;mn&gt;1&lt;/mn&gt;&lt;mo&gt;+&lt;/mo&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;/msup&gt;
            &lt;mo&gt;−&lt;/mo&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;4&lt;/mn&gt;&lt;/msup&gt;
            &lt;mo&gt;+&lt;/mo&gt;&lt;mn&gt;4&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;6&lt;/mn&gt;&lt;/msup&gt;
          &lt;/mrow&gt;
        &lt;/math&gt;
      &lt;/div&gt;
      &lt;div class=&quot;psr-formula-item&quot;&gt;
        &lt;span class=&quot;psr-formula-swatch psr-o8&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
        &lt;math display=&quot;block&quot; aria-label=&quot;P sub 8 of x equals one plus two x squared minus two x to the fourth plus four x to the sixth minus ten x to the eighth&quot;&gt;
          &lt;mrow&gt;
            &lt;msub&gt;&lt;mi&gt;P&lt;/mi&gt;&lt;mn&gt;8&lt;/mn&gt;&lt;/msub&gt;&lt;mo&gt;(&lt;/mo&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mo&gt;)&lt;/mo&gt;&lt;mo&gt;=&lt;/mo&gt;
            &lt;mn&gt;1&lt;/mn&gt;&lt;mo&gt;+&lt;/mo&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;/msup&gt;
            &lt;mo&gt;−&lt;/mo&gt;&lt;mn&gt;2&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;4&lt;/mn&gt;&lt;/msup&gt;
            &lt;mo&gt;+&lt;/mo&gt;&lt;mn&gt;4&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;6&lt;/mn&gt;&lt;/msup&gt;
            &lt;mo&gt;−&lt;/mo&gt;&lt;mn&gt;10&lt;/mn&gt;&lt;msup&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;mn&gt;8&lt;/mn&gt;&lt;/msup&gt;
          &lt;/mrow&gt;
        &lt;/math&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;perturbation-square-root-viz&#x27;);
  const plot = root.querySelector(&#x27;.psr-plot&#x27;);
  const svg = d3.select(root.querySelector(&#x27;svg[role=&quot;img&quot;]&#x27;));
  const tooltip = root.querySelector(&#x27;.psr-tooltip&#x27;);
  const active = new Map([
    [&#x27;exact&#x27;, true],
    [&#x27;o2&#x27;, true],
    [&#x27;o4&#x27;, true],
    [&#x27;o6&#x27;, true],
    [&#x27;o8&#x27;, true]
  ]);

  const series = [
    { id: &#x27;exact&#x27;, label: &#x27;Exact&#x27;, color: &#x27;var(--foreground)&#x27;, width: 3, dash: null, fn: x =&gt; Math.sqrt(1 + 4 * x * x) },
    { id: &#x27;o2&#x27;, label: &#x27;Order 2&#x27;, color: &#x27;var(--viz-series-1)&#x27;, width: 2, dash: &#x27;7 3&#x27;, fn: x =&gt; 1 + 2 * x ** 2 },
    { id: &#x27;o4&#x27;, label: &#x27;Order 4&#x27;, color: &#x27;var(--viz-series-2)&#x27;, width: 2, dash: &#x27;3 2&#x27;, fn: x =&gt; 1 + 2 * x ** 2 - 2 * x ** 4 },
    { id: &#x27;o6&#x27;, label: &#x27;Order 6&#x27;, color: &#x27;var(--viz-series-3)&#x27;, width: 2, dash: &#x27;9 3 2 3&#x27;, fn: x =&gt; 1 + 2 * x ** 2 - 2 * x ** 4 + 4 * x ** 6 },
    { id: &#x27;o8&#x27;, label: &#x27;Order 8&#x27;, color: &#x27;var(--viz-series-4)&#x27;, width: 2, dash: &#x27;2 2&#x27;, fn: x =&gt; 1 + 2 * x ** 2 - 2 * x ** 4 + 4 * x ** 6 - 10 * x ** 8 }
  ];

  const samples = d3.range(1, 700).map(i =&gt; i / 700);
  let latest = null;

  function updateVisibility() {
    svg.selectAll(&#x27;[data-series]&#x27;).each(function() {
      const id = this.getAttribute(&#x27;data-series&#x27;);
      d3.select(this).style(&#x27;display&#x27;, active.get(id) ? null : &#x27;none&#x27;);
    });
  }

  function hideTooltip() {
    tooltip.hidden = true;
    svg.selectAll(&#x27;[data-chart-hover-guide], [data-chart-hover-marker]&#x27;).style(&#x27;display&#x27;, &#x27;none&#x27;);
  }

  function draw() {
    const measuredWidth = plot.getBoundingClientRect().width;
    if (measuredWidth &lt; 20) return;

    const width = Math.round(measuredWidth);
    const narrow = width &lt;= 420;
    const height = narrow ? 440 : 500;
    const margin = { top: 28, right: 18, bottom: 60, left: narrow ? 58 : 68 };
    const innerWidth = Math.max(120, width - margin.left - margin.right);
    const innerHeight = height - margin.top - margin.bottom;

    svg.selectAll(&#x27;*&#x27;).remove();
    svg.attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);

    svg.append(&#x27;title&#x27;)
      .attr(&#x27;id&#x27;, &#x27;psr-svg-title&#x27;)
      .text(&#x27;Exact positive and negative square-root branches with perturbation truncations&#x27;);

    svg.append(&#x27;desc&#x27;)
      .attr(&#x27;id&#x27;, &#x27;psr-svg-desc&#x27;)
      .text(&#x27;The exact curves plus and minus square root of one plus four x squared are compared with Taylor truncations through powers x squared, x to the fourth, x to the sixth, and x to the eighth. The convergence boundary x equals one half is marked.&#x27;);

    const x = d3.scaleLinear().domain([0, 1]).range([margin.left, margin.left + innerWidth]);
    const allValues = [];
    for (const s of series) {
      for (const xv of samples) {
        const value = s.fn(xv);
        allValues.push(value, -value);
      }
    }
    const extent = d3.extent(allValues);
    const maxAbs = Math.max(Math.abs(extent[0]), Math.abs(extent[1]));
    const y = d3.scaleLinear()
      .domain([-maxAbs * 1.08, maxAbs * 1.08])
      .nice()
      .range([margin.top + innerHeight, margin.top]);

    const clipId = &#x27;psr-plot-clip&#x27;;
    svg.append(&#x27;defs&#x27;)
      .append(&#x27;clipPath&#x27;)
      .attr(&#x27;id&#x27;, clipId)
      .append(&#x27;rect&#x27;)
      .attr(&#x27;x&#x27;, margin.left)
      .attr(&#x27;y&#x27;, margin.top)
      .attr(&#x27;width&#x27;, innerWidth)
      .attr(&#x27;height&#x27;, innerHeight);

    const clipped = svg.append(&#x27;g&#x27;).attr(&#x27;clip-path&#x27;, `url(#${clipId})`);

    clipped.append(&#x27;rect&#x27;)
      .attr(&#x27;class&#x27;, &#x27;psr-convergence-region&#x27;)
      .attr(&#x27;x&#x27;, x(0))
      .attr(&#x27;y&#x27;, margin.top)
      .attr(&#x27;width&#x27;, x(0.5) - x(0))
      .attr(&#x27;height&#x27;, innerHeight);

    const yTicks = y.ticks(narrow ? 7 : 9);
    svg.append(&#x27;g&#x27;)
      .attr(&#x27;class&#x27;, &#x27;psr-grid&#x27;)
      .attr(&#x27;transform&#x27;, `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).tickValues(yTicks).tickSize(-innerWidth).tickFormat(&#x27;&#x27;));

    const xTickValues = narrow ? [0, 0.5, 1] : [0, 0.2, 0.4, 0.6, 0.8, 1];
    svg.append(&#x27;g&#x27;)
      .attr(&#x27;class&#x27;, &#x27;psr-axis&#x27;)
      .attr(&#x27;transform&#x27;, `translate(0,${margin.top + innerHeight})`)
      .call(d3.axisBottom(x).tickValues(xTickValues).tickFormat(d3.format(&#x27;.1f&#x27;)));

    svg.append(&#x27;g&#x27;)
      .attr(&#x27;class&#x27;, &#x27;psr-axis&#x27;)
      .attr(&#x27;transform&#x27;, `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).tickValues(yTicks).tickFormat(d3.format(&#x27;~g&#x27;)));

    svg.append(&#x27;rect&#x27;)
      .attr(&#x27;class&#x27;, &#x27;psr-frame&#x27;)
      .attr(&#x27;data-chart-frame&#x27;, &#x27;&#x27;)
      .attr(&#x27;x&#x27;, margin.left)
      .attr(&#x27;y&#x27;, margin.top)
      .attr(&#x27;width&#x27;, innerWidth)
      .attr(&#x27;height&#x27;, innerHeight);

    svg.append(&#x27;text&#x27;)
      .attr(&#x27;class&#x27;, &#x27;axis-title&#x27;)
      .attr(&#x27;data-axis&#x27;, &#x27;x&#x27;)
      .attr(&#x27;x&#x27;, margin.left + innerWidth / 2)
      .attr(&#x27;y&#x27;, height - 12)
      .attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;)
      .text(&#x27;x (dimensionless)&#x27;);

    svg.append(&#x27;text&#x27;)
      .attr(&#x27;class&#x27;, &#x27;axis-title&#x27;)
      .attr(&#x27;data-axis&#x27;, &#x27;y&#x27;)
      .attr(&#x27;transform&#x27;, `translate(16,${margin.top + innerHeight / 2}) rotate(-90)`)
      .attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;)
      .text(&#x27;f(x) (dimensionless)&#x27;);

    clipped.append(&#x27;line&#x27;)
      .attr(&#x27;class&#x27;, &#x27;psr-boundary&#x27;)
      .attr(&#x27;x1&#x27;, x(0.5))
      .attr(&#x27;x2&#x27;, x(0.5))
      .attr(&#x27;y1&#x27;, margin.top)
      .attr(&#x27;y2&#x27;, margin.top + innerHeight);

    svg.append(&#x27;text&#x27;)
      .attr(&#x27;class&#x27;, &#x27;psr-annotation&#x27;)
      .attr(&#x27;x&#x27;, x(0.5) - 6)
      .attr(&#x27;y&#x27;, margin.top + 16)
      .attr(&#x27;text-anchor&#x27;, &#x27;end&#x27;)
      .text(narrow ? &#x27;series converges&#x27; : &#x27;perturbation series converges&#x27;);

    svg.append(&#x27;text&#x27;)
      .attr(&#x27;class&#x27;, &#x27;psr-annotation&#x27;)
      .attr(&#x27;x&#x27;, x(0.5) + 6)
      .attr(&#x27;y&#x27;, margin.top + 16)
      .attr(&#x27;text-anchor&#x27;, &#x27;start&#x27;)
      .text(&#x27;x = 0.5&#x27;);

    const line = branch =&gt; d3.line()
      .x(d =&gt; x(d.x))
      .y(d =&gt; y(branch * d.value));

    for (const s of series) {
      const values = samples.map(xv =&gt; ({ x: xv, value: s.fn(xv) }));
      for (const branch of [1, -1]) {
        clipped.append(&#x27;path&#x27;)
          .datum(values)
          .attr(&#x27;class&#x27;, &#x27;psr-series&#x27;)
          .attr(&#x27;data-series&#x27;, s.id)
          .attr(&#x27;data-branch&#x27;, branch &gt; 0 ? &#x27;positive&#x27; : &#x27;negative&#x27;)
          .attr(&#x27;d&#x27;, line(branch))
          .attr(&#x27;stroke&#x27;, s.color)
          .attr(&#x27;stroke-width&#x27;, s.width)
          .attr(&#x27;stroke-dasharray&#x27;, s.dash);
      }
    }

    const guide = svg.append(&#x27;line&#x27;)
      .attr(&#x27;data-chart-hover-guide&#x27;, &#x27;&#x27;)
      .attr(&#x27;y1&#x27;, margin.top)
      .attr(&#x27;y2&#x27;, margin.top + innerHeight)
      .style(&#x27;display&#x27;, &#x27;none&#x27;);

    const markers = [];
    for (const s of series) {
      for (const branch of [1, -1]) {
        const marker = svg.append(&#x27;circle&#x27;)
          .attr(&#x27;data-chart-hover-marker&#x27;, &#x27;&#x27;)
          .attr(&#x27;data-series&#x27;, s.id)
          .attr(&#x27;data-branch&#x27;, branch &gt; 0 ? &#x27;positive&#x27; : &#x27;negative&#x27;)
          .attr(&#x27;r&#x27;, 3.5)
          .attr(&#x27;stroke&#x27;, s.color)
          .style(&#x27;display&#x27;, &#x27;none&#x27;);
        markers.push({ marker, series: s, branch });
      }
    }

    const overlay = svg.append(&#x27;rect&#x27;)
      .attr(&#x27;data-chart-hit&#x27;, &#x27;&#x27;)
      .attr(&#x27;data-chart-hover-overlay&#x27;, &#x27;cross-series&#x27;)
      .attr(&#x27;x&#x27;, margin.left + 4)
      .attr(&#x27;y&#x27;, margin.top)
      .attr(&#x27;width&#x27;, innerWidth - 8)
      .attr(&#x27;height&#x27;, innerHeight)
      .attr(&#x27;fill&#x27;, &#x27;transparent&#x27;)
      .style(&#x27;cursor&#x27;, &#x27;crosshair&#x27;);

    overlay.on(&#x27;pointermove&#x27;, function(event) {
      const [px] = d3.pointer(event, svg.node());
      const clampedPx = Math.max(margin.left + 4, Math.min(margin.left + innerWidth - 4, px));
      const xv = x.invert(clampedPx);
      guide.attr(&#x27;x1&#x27;, clampedPx).attr(&#x27;x2&#x27;, clampedPx).style(&#x27;display&#x27;, null);

      for (const item of markers) {
        const value = item.series.fn(xv) * item.branch;
        item.marker
          .attr(&#x27;cx&#x27;, clampedPx)
          .attr(&#x27;cy&#x27;, y(value))
          .style(&#x27;display&#x27;, active.get(item.series.id) ? null : &#x27;none&#x27;);
      }

      const visible = series.filter(s =&gt; active.get(s.id));
      const signed = d3.format(&#x27;+.3f&#x27;);
      tooltip.innerHTML = `&lt;div class=&quot;psr-tooltip-x&quot;&gt;x = ${d3.format(&#x27;.3f&#x27;)(xv)}&lt;/div&gt;` + visible.map(s =&gt; {
        const value = s.fn(xv);
        return `&lt;div class=&quot;psr-tooltip-row&quot;&gt;&lt;span class=&quot;psr-tooltip-swatch&quot; style=&quot;background:${s.color}&quot;&gt;&lt;/span&gt;&lt;span&gt;${s.label}&lt;/span&gt;&lt;span&gt;${signed(value)} / ${signed(-value)}&lt;/span&gt;&lt;/div&gt;`;
      }).join(&#x27;&#x27;);
      tooltip.hidden = false;

      const rootRect = root.getBoundingClientRect();
      const svgRect = svg.node().getBoundingClientRect();
      const tipRect = tooltip.getBoundingClientRect();
      const cursorLeft = svgRect.left - rootRect.left + (clampedPx / width) * svgRect.width;
      const preferRight = cursorLeft + 14;
      const left = preferRight + tipRect.width &lt;= rootRect.width - 4
        ? preferRight
        : Math.max(4, cursorLeft - tipRect.width - 14);
      const top = Math.max(4, svgRect.top - rootRect.top + 12);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    });

    overlay.on(&#x27;pointerleave&#x27;, hideTooltip);
    latest = { width, height };
    updateVisibility();
  }

  for (const button of root.querySelectorAll(&#x27;.psr-legend button&#x27;)) {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      const id = button.dataset.series;
      const next = !active.get(id);
      active.set(id, next);
      button.setAttribute(&#x27;aria-pressed&#x27;, String(next));
      hideTooltip();
      updateVisibility();
    });
  }

  const observer = new ResizeObserver(entries =&gt; {
    const nextWidth = Math.round(entries[0].contentRect.width);
    if (!latest || nextWidth !== latest.width) draw();
  });
  observer.observe(plot);
  draw();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
